[project]
name = "market-intel-unit"
version = "0.1.0"
description = "A group of LangGraph-based agents for fetching and processing market intelligence data"
requires-python = "==3.13.13"
dependencies = [
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "langchain-openrouter>=0.2.1",
    "mlflow-skinny>=3.11.0",
    "langchain-mcp-adapters>=0.2.2",
    "pygments>=2.0.0",
    "ruff>=0.10.0",
    "a2a-sdk[all]>=1.0.2",
    "pandas>=3.0.0"
]

[tool.uv]
# uv configuration

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.10.0",
    "ruff>=0.11.0",
]
