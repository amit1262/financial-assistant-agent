name: faa
services:
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - vol_ollama:/app
    networks:
      - private_network
    command: ["serve"]
    env_file:
      - .env
    restart: on-failure:3

