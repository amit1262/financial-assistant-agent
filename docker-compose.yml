  #   restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent_service
    ports:
      - "8000:8000"
    networks:
      - private_network
    depends_on:
      - ollama
    env_file: 
      - ./agent/.env
    volumes:
      - ./agent:/app
    restart: on-failure:3


networks:
  private_network:
    driver: bridge

volumes:
  vol_ollama:
    driver: local
  vol_agent:
    driver: local